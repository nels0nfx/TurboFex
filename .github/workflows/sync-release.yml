name: Sync code from release

# Runs every time you publish a release, and you can also run it by hand
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Find and download the release zip
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$EVENT_TAG"
          if [ -z "$TAG" ]; then
            # Run by hand: use the highest version that has a zip attached
            TAG=$(gh api "repos/$REPO/releases?per_page=30" --jq '.[] | select(.draft==false) | select(any(.assets[]; .name | endswith(".zip"))) | .tag_name' | sort -V | tail -1)
          fi
          echo "Release chosen: $TAG"
          if [ -z "$TAG" ] || ! gh release download "$TAG" --pattern "*.zip" --dir /tmp/rel --repo "$REPO"; then
            echo "::warning::No zip file is attached to the release, nothing to sync."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Replace the repo files with the release files
        if: steps.dl.outputs.found == 'true'
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -o "$(ls /tmp/rel/*.zip | head -1)" -d .

      - name: Save the changes
        if: steps.dl.outputs.found == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "TurboFex ${{ steps.dl.outputs.tag }}" || echo "Nothing to change"
          git push
